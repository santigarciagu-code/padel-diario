<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario de Pádel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pádel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f9d55">
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#16241a;--mut:#6b7a6f;--line:#dfe8dc;--acc:#1f9d55;--acc2:#e8f6ed;--bad:#d64545;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--card:#18231b;--ink:#e8f1ea;--mut:#93a597;--line:#26362b;--acc:#3ecf7b;--acc2:#1c3326;--bad:#ff7a7a;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#0f1712;--card:#18231b;--ink:#e8f1ea;--mut:#93a597;--line:#26362b;--acc:#3ecf7b;--acc2:#1c3326;--bad:#ff7a7a;--warn:#f0b35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 110px}
h1{font-size:22px;margin:18px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px}
label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tipo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tipo .chip{border-radius:14px;text-align:center;padding:12px 2px;font-size:14px;min-width:0}
.scale{display:flex;gap:6px}
.scale .chip{flex:1;padding:10px 0;font-size:22px;border-radius:12px;text-align:center}
.btn{width:100%;border:0;background:var(--acc);color:#fff;font:600 17px inherit;border-radius:14px;padding:15px;margin-top:16px;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:12px inherit;padding:6px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc);font-weight:600}
.bar{padding:10px 12px;border-radius:12px;font-size:13px;margin:10px 0}
.bar.ok{background:var(--acc2);color:var(--acc)}.bar.err{background:#fde7e7;color:#a12626}.bar.warn{background:#fff3dc;color:#8a5a00}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row small{color:var(--mut)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.pill.d{background:#fde7e7;color:#a12626}.pill.t{background:#e8eefc;color:#2f4fa8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut)}
canvas{max-height:240px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:48px;line-height:1.2;text-align:left;padding:0 12px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.3em;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
input,textarea,select{font-size:16px}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 2px 8px;font:inherit;font-size:12px;cursor:pointer;text-align:center}
.opt svg{display:block;margin:0 auto 4px;width:34px;height:48px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.opt.on svg{fill:rgba(255,255,255,.22)}

.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);min-height:28px}
.back{border:0;background:none;color:var(--acc);font:600 15px inherit;padding:4px 0;cursor:pointer}
.q{font-size:24px;font-weight:700;margin:14px 0 4px}
.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
.step{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.big{display:flex;flex-direction:column;gap:10px}
.big .chip{border-radius:16px;padding:18px 16px;font-size:18px;text-align:left;display:flex;align-items:center;gap:12px}
.big .chip em{font-style:normal;font-size:26px}
.big.two{flex-direction:row}.big.two .chip{flex:1;justify-content:center}
.datebtn{position:relative;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:16px;padding:16px;font-size:17px;margin-top:10px;background:var(--bg)}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.sum .row{cursor:pointer}
.sum .row b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.sum .row span.v{font-size:16px}
.chev{color:var(--mut)}
.btn[disabled]{opacity:.4}
.sens{margin-bottom:6px}
.sens .nm{display:flex;justify-content:space-between;font-size:15px;margin:14px 0 6px}
.pc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg)}
.pc .hd{display:flex;align-items:center;gap:10px}
.pc .hd>svg{width:26px;height:36px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;flex:none}
.pc .nm{font-weight:700}.pc .st{color:var(--mut);font-size:13px}
.pc .win{margin-left:auto;text-align:right}.pc .win b{font-size:22px;color:var(--acc)}
.star{font-size:12px;background:var(--acc2);color:var(--acc);padding:2px 8px;border-radius:999px;margin-left:6px}
.mb{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:8px;font-size:12px;margin-top:6px;color:var(--mut)}
.mb i{display:block;height:8px;border-radius:6px;background:var(--line);overflow:hidden}.mb i u{display:block;height:100%;background:var(--acc);border-radius:6px}
.mb span:last-child{text-align:right;color:var(--ink)}
.lugar{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.lugar:first-of-type{border-top:0}
.tb{display:grid;grid-template-columns:128px 1fr 24px;align-items:center;gap:8px;margin:7px 0;font-size:15px}.tb i{display:block;height:12px;border-radius:8px;background:var(--line);overflow:hidden}.tb u{display:block;height:100%;background:var(--acc);border-radius:8px;min-width:0}.tb b{text-align:right}
.chip svg.mini{width:22px;height:30px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;flex:none}
.chip.on svg.mini{fill:rgba(255,255,255,.25)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.prow:first-of-type{border-top:0}
.prow svg{width:22px;height:30px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;flex:none}
.prow span.n{flex:1;font-size:16px}
.hide{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<h1>🎾 Diario de Pádel</h1>
<div class="sub" id="sub"></div>
<div id="status"></div>

<section id="v-new"></section>
<section id="v-hist" class="hide"></section>
<section id="v-rep" class="hide"></section>
<section id="v-cfg" class="hide"></section>

<nav>
  <button data-v="new" class="on"><b>➕</b>Nuevo</button>
  <button data-v="hist"><b>📒</b>Historial</button>
  <button data-v="rep"><b>📊</b>Informes</button>
  <button data-v="cfg"><b>⚙️</b>Ajustes</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ---------- almacenamiento: IndexedDB en el móvil + copia en archivo ----------
var LS = {
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var rows = [];
var misPalas = [];
var pEdit = null;
var editRow = null;
var charts = {};
var FORMAS = ['Redonda','Lágrima','Diamante','Híbrida'];
var TRAB = ['Saque','Volea','Bandeja / víbora','Remate','Defensa','Globo','Físico','Táctica'];
function normTrab(s){var o=[];String(s||'').split(',').forEach(function(x){x=x.trim(); if(x==='Bandeja'||x==='Víbora')x='Bandeja / víbora'; if(x&&o.indexOf(x)<0)o.push(x)});return o}
var DUR = [45,60,90,120,150];
var EMO = ['😖','😕','😐','🙂','🤩'];
var f = blank();
var DB=null, persisted=null;

function blank(){
  var d=new Date(); var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return {fecha:iso,pala:'',forma:'',pista:'',duracion:90,control:3,potencia:3,comodidad:3,fisico:3,tipo:'',resultado:'',marcador:'',lugar:'',trabajado:[],con:'',notas:''};
}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function dbOpen(){
  return new Promise(function(res,rej){
    var q=indexedDB.open('padel-diario',2);
    q.onupgradeneeded=function(){var d=q.result; if(!d.objectStoreNames.contains('partidos'))d.createObjectStore('partidos',{keyPath:'id',autoIncrement:true}); if(!d.objectStoreNames.contains('palas'))d.createObjectStore('palas',{keyPath:'id',autoIncrement:true})};
    q.onsuccess=function(){DB=q.result;res()}; q.onerror=function(){rej(q.error)};
  });
}
function tx(mode,fn,store){
  store=store||'partidos';
  return new Promise(function(res,rej){
    var t=DB.transaction(store,mode),s=t.objectStore(store),r=fn(s);
    t.oncomplete=function(){res(r&&r.result)}; t.onerror=function(){rej(t.error)}; t.onabort=function(){rej(t.error)};
  });
}
function dbAll(st){return tx('readonly',function(s){return s.getAll()},st)}
function dbPut(o,st){return tx('readwrite',function(s){return s.put(o)},st)}
function dbDel(id,st){return tx('readwrite',function(s){return s.delete(id)},st)}
function dbClear(){return tx('readwrite',function(s){return s.clear()})}

function status(msg,cls){ $('#status').innerHTML = msg?'<div class="bar '+cls+'">'+msg+'</div>':''; if(msg&&(cls==='warn'||cls==='err')) window.scrollTo(0,0); }
function backupInfo(){
  var lb=LS.get('padel_backup',{n:0,t:''});
  var sin=rows.length-lb.n;
  if(!rows.length) return '';
  if(!lb.t) return 'Aún no has guardado ninguna copia en Archivos. Ve a ⚙️ Ajustes.';
  if(sin>=3) return 'Llevas '+sin+' partidos sin copia. Guarda una copia en ⚙️ Ajustes.';
  return '';
}
function load(){
  return Promise.all([dbAll(),dbAll('palas')]).then(function(x){
    var r=x[0]; misPalas=x[1];
    rows=r.map(function(x){x.row=x.id;return x});
    var w=backupInfo();
    status(w?('📁 '+w):'','warn');
    render();
  });
}
function init(){
  dbOpen().then(function(){
    if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(function(p){persisted=p;render()})}
    return load();
  }).catch(function(e){status('No puedo usar el almacenamiento del móvil: '+esc(e&&e.message||e),'err')});
}

// ---------- vistas ----------
function show(v){
  ['new','hist','rep','cfg'].forEach(function(x){$('#v-'+x).classList.toggle('hide',x!==v)});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  render();
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){ show(b.dataset.v)}});

var SHAPES={Redonda:"M20 3 C31 3 36 12 36 20 C36 29 29 38 20 38 C11 38 4 29 4 20 C4 12 9 3 20 3Z",Lágrima:"M20 3 C34 3 36 18 28 30 L20 38 L12 30 C4 18 6 3 20 3Z",Diamante:"M20 2 L36 24 L20 38 L4 24Z",Híbrida:"M20 3 C32 3 35 14 33 22 C31 30 26 38 20 38 C14 38 9 30 7 22 C5 14 8 3 20 3Z"};
function shapes(cur){
  return '<div class="shapes">'+FORMAS.map(function(n){
    return '<button type="button" class="opt'+(cur===n?' on':'')+'" data-k="forma" data-v="'+n+'"><svg viewBox="0 0 40 56"><path d="'+SHAPES[n]+'"/><path d="M20 38 V54"/></svg>'+n+'</button>';
  }).join('')+'</div>';
}
function chips(name,list,cur,cls){
  return '<div class="'+(cls||'chips')+'">'+list.map(function(x){
    return '<button type="button" class="chip'+(String(cur)===String(x)?' on':'')+'" data-k="'+name+'" data-v="'+esc(x)+'">'+esc(x)+'</button>';
  }).join('')+'</div>';
}
function scale(name){
  return '<div class="scale">'+[1,2,3,4,5].map(function(n){
    return '<button type="button" class="chip'+(f[name]===n?' on':'')+'" data-k="'+name+'" data-v="'+n+'">'+EMO[n-1]+'</button>';
  }).join('')+'</div>';
}
function palas(){
  var s={}; rows.forEach(function(r){if(r.pala)s[r.pala]=1}); return Object.keys(s);
}

var wiz={i:0,review:false,edit:null,auto:false,sure:false};
function stepsFor(){
  return f.tipo==='Entrenamiento'
    ? ['tipo','fecha','lugar','trabajo','pala','forma','pista','duracion','sens','extra']
    : ['tipo','fecha','resultado','marcador','pala','forma','pista','duracion','sens','extra'];
}
function curStep(){return wiz.edit||(wiz.review?'review':stepsFor()[wiz.i])}
function freq(field,filter){
  var c={},o=[]; rows.forEach(function(r){ if(filter&&!filter(r))return; if(r[field]) c[r[field]]=(c[r[field]]||0)+1});
  Object.keys(c).forEach(function(k){o.push(k)}); o.sort(function(a,b){return c[b]-c[a]}); return o.slice(0,6);
}
function isoDay(off){var d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaBonita(iso){var p=String(iso).slice(0,10).split('-');return p.length===3?(+p[2])+' '+MES[+p[1]-1]+' '+p[0]:iso}

function grab(){
  ['lugar','marcador','pala','con','notas'].forEach(function(id){var e=document.getElementById(id); if(e) f[id]=e.value;});
}
function nextStep(noGrab){
  if(!noGrab) grab();
  if(wiz.edit){wiz.edit=null;renderNew();return}
  var st=stepsFor(); wiz.i++;
  if(st[wiz.i]==='forma'&&wiz.auto&&f.forma) wiz.i++;
  if(wiz.i>=st.length){wiz.review=true;wiz.i=st.length-1}
  status('',''); renderNew(); window.scrollTo(0,0);
}
function backStep(){
  grab();
  if(wiz.edit){wiz.edit=null;renderNew();return}
  if(wiz.review&&editRow===null){wiz.review=false;renderNew();return}
  if(wiz.i>0){wiz.i--; if(stepsFor()[wiz.i]==='forma'&&wiz.auto&&wiz.i>0)wiz.i--; wiz.review=false; renderNew(); window.scrollTo(0,0)}
}
function lastRow(){
  return rows.slice().sort(function(a,b){return String(b.fecha).localeCompare(String(a.fecha))||((b.id||0)-(a.id||0))})[0];
}
function resetWiz(){wiz={i:0,review:false,edit:null,auto:false,sure:false}}

function bigBtn(a,v,icon,label,cur){return '<button type="button" class="chip'+(cur===v?' on':'')+'" data-a="'+a+'" data-v="'+esc(v)+'">'+(icon?'<em>'+icon+'</em>':'')+esc(label||v)+'</button>'}
function nextBtn(label,dis){return '<button class="btn" data-a="next"'+(dis?' disabled':'')+'>'+(label||'Siguiente')+'</button>'}

var STEP={
  tipo:function(){
    var l=editRow?null:lastRow();
    var rep=l?'<button type="button" class="chip" data-a="repeat" style="width:100%;border-radius:16px;padding:14px 16px;text-align:left;margin-bottom:14px;background:var(--acc2);border-color:var(--acc);color:var(--ink)"><b>⚡ Repetir el último</b><br><span style="color:var(--mut);font-size:14px">'+esc([l.tipo,l.pala,l.pista,l.duracion?l.duracion+' min':''].filter(Boolean).join(' · '))+'</span></button>':'';
    return [rep+'<div class="q">¿Qué has jugado?</div><div class="hint">Toca una opción</div><div class="big">',
    bigBtn('tipo','Competición','🏆','Competición',f.tipo),bigBtn('tipo','Amistoso','🤝','Amistoso',f.tipo),bigBtn('tipo','Entrenamiento','🏋️','Entrenamiento',f.tipo),'</div>'].join('')},
  fecha:function(){
    var opts=[[0,'Hoy'],[1,'Ayer'],[2,'Anteayer']];
    var known=opts.some(function(o){return isoDay(o[0])===f.fecha});
    return '<div class="q">¿Cuándo fue?</div><div class="hint">Toca el día</div><div class="big">'+
      opts.map(function(o){return bigBtn('dia',isoDay(o[0]),'📅',o[1]+' · '+fechaBonita(isoDay(o[0])),f.fecha)}).join('')+'</div>'+
      '<label class="datebtn"><span>🗓️</span><span>'+(known?'Otra fecha…':'Fecha: <b>'+fechaBonita(f.fecha)+'</b>')+'</span><input type="date" id="fecha" value="'+esc(f.fecha)+'"></label>'+
      (known?'':nextBtn('Continuar'));
  },
  lugar:function(){
    var rec=freq('lugar',function(r){return r.tipo==='Entrenamiento'});
    return '<div class="q">¿Dónde ha sido el entrenamiento?</div><div class="hint">Elige uno reciente o escribe otro</div>'+
      (rec.length?'<div class="chips" style="margin-bottom:12px">'+rec.map(function(p){return '<button type="button" class="chip" data-a="lugarchip" data-v="'+esc(p)+'">'+esc(p)+'</button>'}).join('')+'</div>':'')+
      '<input id="lugar" placeholder="Club, pista o academia" value="'+esc(f.lugar)+'">'+nextBtn();
  },
  trabajo:function(){return '<div class="q">¿Qué has trabajado?</div><div class="hint">Puedes marcar varias</div><div class="chips">'+
    TRAB.map(function(t){return '<button type="button" class="chip'+(f.trabajado.indexOf(t)>=0?' on':'')+'" data-a="trab" data-v="'+t+'">'+t+'</button>'}).join('')+'</div>'+nextBtn(f.trabajado.length?'Siguiente':'Saltar')},
  resultado:function(){return '<div class="q">¿Cómo ha ido?</div><div class="hint">Toca el resultado</div><div class="big two">'+
    bigBtn('res','Victoria','✅','Victoria',f.resultado)+bigBtn('res','Derrota','❌','Derrota',f.resultado)+'</div>'},
  marcador:function(){return '<div class="q">¿Marcador?</div><div class="hint">Opcional. Ej. 6-4 3-6 7-5</div><input id="marcador" placeholder="6-4 3-6 7-5" value="'+esc(f.marcador)+'">'+nextBtn('Siguiente')},
  pala:function(){
    var mp=misPalas.filter(function(p){return p.activa!==false});
    if(mp.length){
      var nombres=mp.map(function(p){return p.nombre});
      return '<div class="q">¿Con qué pala?</div><div class="hint">Toca una de tus palas</div><div class="big" style="margin-bottom:12px">'+
        mp.map(function(p){return '<button type="button" class="chip'+(f.pala===p.nombre?' on':'')+'" data-a="mipala" data-v="'+p.id+'">'+(SHAPES[p.forma]?'<svg class="mini" viewBox="0 0 40 56"><path d="'+SHAPES[p.forma]+'"/><path d="M20 38 V54"/></svg>':'<em>🎾</em>')+'<span>'+esc(p.nombre)+'</span></button>'}).join('')+'</div>'+
        '<input id="pala" placeholder="Otra pala (prestada, nueva…)" value="'+(nombres.indexOf(f.pala)>=0?'':esc(f.pala))+'">'+nextBtn('Usar esta otra pala');
    }
    var rec=freq('pala');

      '<input id="pala" placeholder="'+(rec.length?'Otra pala…':'Ej. Bullpadel Vertex')+'" value="'+(rec.indexOf(f.pala)>=0?'':esc(f.pala))+'">'+nextBtn()},
  forma:function(){return '<div class="q">¿Qué forma tiene?</div><div class="hint">Toca la forma</div>'+shapes(f.forma).replace(/data-k="forma"/g,'data-a="forma"')},
  pista:function(){return '<div class="q">¿Qué pista?</div><div class="big two">'+bigBtn('pista','Interior','🏟️','Interior',f.pista)+bigBtn('pista','Exterior','☀️','Exterior',f.pista)+'</div>'+(f.pista?nextBtn('Seguir con '+f.pista):'')},
  duracion:function(){return '<div class="q">¿Cuánto duró?</div><div class="hint">Minutos</div><div class="chips">'+DUR.map(function(d){return '<button type="button" class="chip'+(f.duracion===d?' on':'')+'" data-a="dur" data-v="'+d+'" style="padding:16px 20px;font-size:18px">'+d+'</button>'}).join('')+'</div>'+nextBtn('Seguir con '+f.duracion+' min')},
  sens:function(){
    var names=[['control','Control'],['potencia','Potencia'],['comodidad','Comodidad / brazo'],['fisico','Estado físico']];
    var ok=names.every(function(n){return f[n[0]]>0});
    return '<div class="q">¿Qué sensaciones tuviste?</div><div class="hint">Empiezan en 😐. Toca solo las que cambien</div>'+names.map(function(n){
      return '<div class="sens"><div class="nm"><span>'+n[1]+'</span></div><div class="scale">'+[1,2,3,4,5].map(function(k){return '<button type="button" class="chip'+(f[n[0]]===k?' on':'')+'" data-a="sc" data-n="'+n[0]+'" data-v="'+k+'">'+EMO[k-1]+'</button>'}).join('')+'</div></div>'}).join('')+nextBtn('Siguiente',!ok)},
  extra:function(){return '<div class="q">¿Algo más?</div><div class="hint">Todo opcional</div><label class="l">Con quién</label><input id="con" value="'+esc(f.con)+'"><label class="l">Notas</label><textarea id="notas" placeholder="Qué funcionó, qué no…">'+esc(f.notas)+'</textarea>'+nextBtn('Revisar')},
  review:function(){
    var tr=f.tipo==='Entrenamiento';

    else{L.push(['resultado','Resultado',f.resultado||'⚠️ Falta'],['marcador','Marcador',f.marcador||'—'])}
    L.push(['pala','Pala',f.pala],['forma','Forma',f.forma||'—'],['pista','Pista',f.pista||'—'],['duracion','Duración',f.duracion+' min'],
      ['sens','Sensaciones','Control '+EMO[f.control-1]+' · Potencia '+EMO[f.potencia-1]+' · Comodidad '+EMO[f.comodidad-1]+' · Físico '+EMO[f.fisico-1]],
      ['extra','Extra',[f.con,f.notas].filter(Boolean).join(' · ')||'—']);

      L.map(function(l){return '<div class="row" data-a="edit" data-v="'+l[0]+'"><div><b>'+l[1]+'</b><span class="v">'+esc(l[2])+'</span></div><span class="chev">›</span></div>'}).join('')+'</div>'+

  }
};

function renderNew(){
  var st=curStep(), steps=stepsFor(), n=steps.length;
  var inReview=st==='review';
  var pos=wiz.edit?null:(inReview?n:wiz.i+1);
  var top='<div class="top"><span>'+((wiz.i>0||wiz.edit||(wiz.review&&editRow===null))?'<button class="back" data-a="back">‹ Atrás</button>':'')+'</span><span>'+(inReview||wiz.edit?'':'Paso '+pos+' de '+n)+'</span></div>'+
    (wiz.edit?'':'<div class="prog"><i style="width:'+Math.round(100*(inReview?n:wiz.i)/n)+'%"></i></div>');
  $('#v-new').innerHTML=top+'<div class="step" id="stepbox">'+STEP[st]()+'</div>';
  var m=$('#v-new');
  m.onclick=function(e){var b=e.target.closest('[data-a]'); if(b) act(b.dataset.a,b.dataset.v,b.dataset.n)};
  var sv=$('#save'); if(sv) sv.onclick=save;
  var d=document.getElementById('fecha'); if(d&&st==='fecha') d.onchange=function(){ if(d.value){f.fecha=d.value; nextStep(true)} };
}
function act(a,v,n){
  if(a==='back') return backStep();
  if(a==='repeat'){
    var l=lastRow(); if(!l) return;
    f=Object.assign(blank(),{tipo:l.tipo,pala:l.pala,forma:l.forma,pista:l.pista,duracion:+l.duracion||90,lugar:l.tipo==='Entrenamiento'?(l.lugar||''):'',trabajado:l.tipo==='Entrenamiento'?normTrab(l.trabajado):[]});
    resetWiz(); wiz.review=true; status('⚡ Copiado del último. Pon el resultado y cambia lo que haga falta.','ok'); renderNew(); window.scrollTo(0,0); return;
  }
  if(a==='tipo'){
    var l0=editRow?null:lastRow();
    if(l0&&!f.pista){f.pista=l0.pista||'';f.duracion=+l0.duracion||f.duracion}
    f.tipo=v; if(v==='Entrenamiento'){f.resultado='';f.marcador=''}else{f.lugar='';f.trabajado=[]} return nextStep(true); }
  if(a==='dia'){ f.fecha=v; return nextStep(true); }
  if(a==='res'){ f.resultado=v; return nextStep(true); }
  if(a==='lugarchip'){ f.lugar=v; return nextStep(true); }
  if(a==='palachip'){
    f.pala=v; var last=rows.filter(function(r){return r.pala===v}).sort(function(x,y){return String(y.fecha).localeCompare(String(x.fecha))})[0];
    if(last&&last.forma){f.forma=last.forma;wiz.auto=true}
    return nextStep(true);
  }
  if(a==='mipala'){ var mp=misPalas.filter(function(p){return String(p.id)===String(v)})[0]; if(!mp)return; f.pala=mp.nombre; if(mp.forma){f.forma=mp.forma;wiz.auto=true} return nextStep(true); }
  if(a==='forma'){ f.forma=v; wiz.auto=false; return nextStep(true); }
  if(a==='pista'){ f.pista=v; return nextStep(true); }
  if(a==='dur'){ f.duracion=+v; return nextStep(true); }
  if(a==='trab'){ var i=f.trabajado.indexOf(v); if(i>=0)f.trabajado.splice(i,1); else f.trabajado.push(v); return renderNew(); }
  if(a==='sc'){ f[n]=+v; return renderNew(); }
  if(a==='edit'){ grab(); wiz.edit=v; return renderNew(); }
  if(a==='cancel'){ editRow=null; f=blank(); resetWiz(); return show('hist'); }
  if(a==='del'){ if(wiz.sure){ return doDelete(); } wiz.sure=true; return renderNew(); }
  if(a==='next'){
    grab(); var st=curStep();
    if(st==='lugar'&&!f.lugar.trim()) return status('⚠️ Indica dónde ha sido.','warn');
    if(st==='pala'){ if(!f.pala.trim()) return status('⚠️ Indica la pala.','warn'); wiz.auto=false; }
    return nextStep();
  }
}

function save(){
  grab();
  var err='';
  if(!f.tipo) err='Elige qué has jugado.';
  else if(!f.pala) err='Indica la pala.';
  else if(f.tipo!=='Entrenamiento' && !f.resultado) err='Indica victoria o derrota.';
  else if(f.tipo==='Entrenamiento' && !f.lugar) err='Indica dónde ha sido el entrenamiento.';
  else if(!f.control||!f.potencia||!f.comodidad||!f.fisico) err='Puntúa las cuatro sensaciones.';
  if(err){status('⚠️ '+err,'warn');return;}
  var datos=Object.assign({},f,{trabajado:f.trabajado.join(', ')});
  var o=Object.assign({},datos); delete o.row;
  if(editRow){o.id=editRow} else {o.creado=new Date().toISOString()}
  var prev=editRow?rows.filter(function(x){return x.id===editRow})[0]:null; if(prev&&prev.creado)o.creado=prev.creado;
  $('#save').disabled=true; $('#save').textContent='Guardando…';
  dbPut(o).then(function(){
    editRow=null; f=blank(); resetWiz(); return load();
  }).then(function(){ show('hist'); status('✅ Guardado en tu móvil','ok'); })
  .catch(function(e){status('No se pudo guardar: '+esc(e&&e.message||e),'err'); $('#save').disabled=false;});
}
function doDelete(){
  dbDel(editRow).then(function(){editRow=null;f=blank();resetWiz();return load()}).then(function(){show('hist')});
}

function avg(a){return a.length?a.reduce(function(x,y){return x+(+y||0)},0)/a.length:0}
function mk(id,cfgc){ if(charts[id])charts[id].destroy(); charts[id]=new Chart(document.getElementById(id),cfgc); }
function mbar(lbl,v){return '<div class="mb"><span>'+lbl+'</span><i><u style="width:'+Math.round(100*(v||0)/5)+'%"></u></i><span>'+(v?v.toFixed(1):'–')+'</span></div>'}
var PCOL=['#1f9d55','#3b6fe0','#e0903b','#9a57d6','#d64545','#12a8b8'];
function radarSvg(series){
  var cx=110,cy=92,R=56,ax=[[0,-1],[1,0],[0,1],[-1,0]];
  var g='';
  [1,2,3,4,5].forEach(function(k){var r=R*k/5;g+='<polygon points="'+ax.map(function(a){return (cx+a[0]*r)+','+(cy+a[1]*r)}).join(' ')+'" fill="none" style="stroke:var(--line)" stroke-width="1"/>'});
  ax.forEach(function(a){g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+a[0]*R)+'" y2="'+(cy+a[1]*R)+'" style="stroke:var(--line)" stroke-width="1"/>'});
  g+='<g style="fill:var(--mut)" font-size="11" font-family="-apple-system,system-ui,sans-serif">'+
    '<text x="'+cx+'" y="'+(cy-R-8)+'" text-anchor="middle">Control</text>'+
    '<text x="'+(cx+R+8)+'" y="'+(cy+4)+'">Potencia</text>'+
    '<text x="'+cx+'" y="'+(cy+R+18)+'" text-anchor="middle">Comodidad</text>'+
    '<text x="'+(cx-R-8)+'" y="'+(cy+4)+'" text-anchor="end">Físico</text></g>';
  series.forEach(function(se){
    var pts=se.vals.map(function(v,i){var r=R*Math.max(0,Math.min(5,v||0))/5;return (cx+ax[i][0]*r).toFixed(1)+','+(cy+ax[i][1]*r).toFixed(1)}).join(' ');
    g+='<polygon points="'+pts+'" fill="'+se.color+'" fill-opacity="'+(series.length>1?.18:.3)+'" stroke="'+se.color+'" stroke-width="2.5" stroke-linejoin="round"/>';
    if(series.length===1) se.vals.forEach(function(v,i){var r=R*(v||0)/5;g+='<circle cx="'+(cx+ax[i][0]*r)+'" cy="'+(cy+ax[i][1]*r)+'" r="3.5" fill="'+se.color+'"/>'});
  });
  return '<svg viewBox="0 0 220 184" style="width:100%;max-width:260px;display:block;margin:0 auto">'+g+'</svg>';
}
function donut(pct,color){
  var r=26,c=2*Math.PI*r,d=(pct||0)/100*c;
  return '<svg viewBox="0 0 70 70" style="width:78px;height:78px;display:block;margin:0 auto"><circle cx="35" cy="35" r="'+r+'" fill="none" style="stroke:var(--line)" stroke-width="9"/>'+
    (d<1?'':'<circle cx="35" cy="35" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 35 35)"/>')+
    '<text x="35" y="40" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--ink)" font-family="-apple-system,system-ui,sans-serif">'+(pct==null?'–':pct+'%')+'</text></svg>';
}
function palasHtml(g){
  var names=palas().filter(function(p){return rows.some(function(r){return r.pala===p})});
  if(!names.length) return '';
  var data=names.map(function(p,i){
    var all=rows.filter(function(r){return r.pala===p});
    var gm=g.filter(function(r){return r.pala===p});
    var w=gm.filter(function(r){return r.resultado==='Victoria'}).length;
    var sens=function(k){return avg(all.map(function(r){return r[k]}))};
    var last=all.slice().sort(function(a,b){return String(b.fecha).localeCompare(String(a.fecha))})[0];
    var vals=[sens('control'),sens('potencia'),sens('comodidad'),sens('fisico')];
    return {p:p,n:all.length,gm:gm.length,w:w,pct:gm.length?Math.round(100*w/gm.length):null,vals:vals,forma:last.forma,nota:avg(vals)};
  }).sort(function(a,b){return b.nota-a.nota});
  data.forEach(function(d,i){d.color=PCOL[i%PCOL.length]});
  var best=data.filter(function(d){return d.gm>=2}).sort(function(a,b){return (b.pct-a.pct)||(b.nota-a.nota)})[0];
  var NM=['Control','Potencia','Comodidad','Físico'];
  var h='<div class="card"><h3>🎾 Tus palas</h3>';
  if(data.length>=2){
    h+='<div class="sub" style="margin:0 0 4px">Comparación de sensaciones (cuanto más lejos del centro, mejor)</div>'+radarSvg(data.slice(0,6).map(function(d){return {vals:d.vals,color:d.color}}))+
      '<div class="chips" style="justify-content:center;margin:6px 0 4px">'+data.slice(0,6).map(function(d){return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:13px"><i style="width:12px;height:12px;border-radius:4px;background:'+d.color+';display:inline-block"></i>'+esc(d.p)+'</span>'}).join('')+'</div>';
  }
  h+=data.map(function(d){
    var mx=d.vals.indexOf(Math.max.apply(null,d.vals)), mn=d.vals.indexOf(Math.min.apply(null,d.vals));
    var sh=SHAPES[d.forma]?'<svg viewBox="0 0 40 56" style="width:34px;height:48px;flex:none;stroke:'+d.color+';fill:'+d.color+'33;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"><path d="'+SHAPES[d.forma]+'"/><path d="M20 38 V54"/></svg>':'';
    return '<div class="pc" style="border-left:5px solid '+d.color+'"><div class="hd">'+sh+'<div><div class="nm">'+esc(d.p)+(best&&best.p===d.p?'<span class="star">⭐ mejor</span>':'')+'</div><div class="st">'+esc(d.forma||'')+' · '+d.n+' sesiones</div></div></div>'+
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px"><div style="flex:1 1 170px;min-width:0">'+radarSvg([{vals:d.vals,color:d.color}])+'</div>'+
      '<div style="flex:0 0 100px;text-align:center">'+donut(d.pct,d.color)+'<div class="st" style="margin-top:4px">'+d.w+' de '+d.gm+' victorias</div></div></div>'+
      '<div class="chips" style="margin-top:8px;gap:6px">'+d.vals.map(function(v,i){return '<span class="pill" style="'+(i===mx?'':'background:var(--line);color:var(--ink)')+'">'+NM[i]+' '+v.toFixed(1)+'</span>'}).join('')+'</div>'+
      '<div class="st" style="margin-top:8px">💪 Punto fuerte: <b>'+NM[mx]+'</b> · 🔧 A mejorar: <b>'+NM[mn]+'</b></div></div>';
  }).join('')+'</div>';
  return h;
}
function trabBars(cnt,n){

}

function palasCfgHtml(){
  var act=misPalas.filter(function(p){return p.activa!==false}), arch=misPalas.filter(function(p){return p.activa===false});
  var h='<div class="card"><h3>🎾 Mis palas</h3>';
  if(pEdit){
    h+='<div class="sub">'+(pEdit.id?'Editar pala':'Nueva pala')+'</div>'+
      '<label class="l">Nombre</label><input id="pn" placeholder="Ej. Bullpadel Vertex" value="'+esc(pEdit.nombre)+'">'+
      '<label class="l">Forma</label>'+shapes(pEdit.forma).replace(/data-k="forma"/g,'data-a="pform"')+
      (pEdit.id?'<div class="sub" style="margin-top:8px">Si cambias el nombre, se actualiza también en tus partidos anteriores.</div>':'')+
      '<button class="btn" data-a="psave">Guardar pala</button><button class="btn sec" data-a="pcancel">Cancelar</button>'+
      (pEdit.id?'<button class="btn del" data-a="parch">Archivar (dejo de usarla)</button>':'');
    return h+'</div>';
  }
  h+='<div class="sub">Las palas que guardes aquí salen como botones al registrar un partido o entrenamiento.</div>';
  h+=act.length?act.map(function(p){return '<div class="prow" data-a="pedit" data-v="'+p.id+'">'+(SHAPES[p.forma]?'<svg viewBox="0 0 40 56"><path d="'+SHAPES[p.forma]+'"/><path d="M20 38 V54"/></svg>':'<span>🎾</span>')+'<span class="n">'+esc(p.nombre)+'<br><small style="color:var(--mut)">'+esc(p.forma||'sin forma')+'</small></span><span class="chev">›</span></div>'}).join(''):'<div class="sub">Todavía no has guardado ninguna.</div>';
  var have={}; misPalas.forEach(function(p){have[p.nombre.toLowerCase()]=1});
  var falta=freq('pala').filter(function(n){return !have[n.toLowerCase()]});
  rows.forEach(function(r){if(r.pala&&!have[r.pala.toLowerCase()]&&falta.indexOf(r.pala)<0)falta.push(r.pala)});
  h+='<button class="btn" data-a="padd">+ Añadir pala</button>';
  if(falta.length) h+='<button class="btn sec" data-a="pimport">Añadir las que ya has usado ('+falta.length+'): '+esc(falta.slice(0,3).join(', '))+(falta.length>3?'…':'')+'</button>';
  if(arch.length) h+='<div class="sub" style="margin-top:12px">Archivadas (toca para recuperar)</div><div class="chips">'+arch.map(function(p){return '<button type="button" class="chip" data-a="punarch" data-v="'+p.id+'">'+esc(p.nombre)+'</button>'}).join('')+'</div>';
  return h+'</div>';
}
function grabP(){var e=document.getElementById('pn'); if(e&&pEdit) pEdit.nombre=e.value}
function cfgAct(a,v){
  if(a==='padd'){pEdit={id:null,nombre:'',forma:''};return renderCfg()}
  if(a==='pedit'){var p=misPalas.filter(function(x){return String(x.id)===String(v)})[0]; if(!p)return; pEdit={id:p.id,nombre:p.nombre,forma:p.forma||'',old:p.nombre}; return renderCfg()}
  if(a==='pform'){grabP(); pEdit.forma=v; return renderCfg()}
  if(a==='pcancel'){pEdit=null; return renderCfg()}
  if(a==='psave'){
    grabP(); var n=(pEdit.nombre||'').trim();
    if(!n) return status('⚠️ Escribe el nombre de la pala.','warn');
    if(!pEdit.forma) return status('⚠️ Elige la forma de la pala.','warn');
    var dup=misPalas.some(function(x){return x.id!==pEdit.id&&x.nombre.toLowerCase()===n.toLowerCase()});
    if(dup) return status('⚠️ Ya tienes una pala con ese nombre.','warn');
    var o={nombre:n,forma:pEdit.forma,activa:true}; if(pEdit.id)o.id=pEdit.id;
    var old=pEdit.old;
    return dbPut(o,'palas').then(function(){
      if(old&&old!==n){return rows.filter(function(r){return r.pala===old}).reduce(function(p,r){var c=Object.assign({},r);delete c.row;c.pala=n;return p.then(function(){return dbPut(c)})},Promise.resolve())}
    }).then(function(){pEdit=null;status('✅ Pala guardada','ok');return load()});
  }
  if(a==='parch'){var q=misPalas.filter(function(x){return x.id===pEdit.id})[0]; if(!q)return; return dbPut(Object.assign({},q,{activa:false}),'palas').then(function(){pEdit=null;return load()})}
  if(a==='punarch'){var u=misPalas.filter(function(x){return String(x.id)===String(v)})[0]; if(!u)return; return dbPut(Object.assign({},u,{activa:true}),'palas').then(load)}
  if(a==='pimport'){
    var have={}; misPalas.forEach(function(p){have[p.nombre.toLowerCase()]=1});
    var nombres=[]; rows.slice().sort(function(a,b){return String(b.fecha).localeCompare(String(a.fecha))}).forEach(function(r){if(r.pala&&!have[r.pala.toLowerCase()]){have[r.pala.toLowerCase()]=1;nombres.push(r)}});
    return nombres.reduce(function(p,r){return p.then(function(){return dbPut({nombre:r.pala,forma:r.forma||'',activa:true},'palas')})},Promise.resolve()).then(function(){status('✅ Añadidas '+nombres.length+' palas. Revisa que la forma sea correcta.','ok');return load()});
  }
}
function renderCfg(){
  var lb=LS.get('padel_backup',{n:0,t:''});
  $('#v-cfg').innerHTML=palasCfgHtml()+'<div class="card"><h3>📁 Copia en tu móvil</h3>'+
    '<div class="sub">Guarda un archivo con todo tu historial y tus palas en la app <b>Archivos</b> del iPhone. Es tu garantía de que nunca pierdes nada.</div>'+
    '<button class="btn" id="bk">Guardar copia en Archivos</button>'+
    '<div class="sub" style="margin-top:8px">'+(lb.t?'Última copia: '+esc(lb.t)+' ('+lb.n+' partidos)':'Todavía no hay copia.')+'</div></div>'+
    '<div class="card"><h3>♻️ Restaurar copia</h3><div class="sub">Elige un archivo <b>padel-diario.json</b>. Se añaden los partidos y palas que falten.</div>'+
    '<input type="file" id="rf" accept=".json,application/json"></div>'+
    '<div class="card"><h3>Estado</h3><div class="sub">Versión de la app: '+VERSION+'<br>Partidos guardados: '+rows.length+'<br>Almacenamiento permanente: '+(persisted===true?'sí ✅':persisted===false?'no concedido (usa la copia)':'comprobando…')+'</div><button class="btn sec" id="upd">Actualizar la app</button><div class="sub" style="margin-top:6px">Descarga la última versión. Tus partidos y palas no se tocan.</div></div>';
  var m=$('#v-cfg'); m.onclick=function(e){var b=e.target.closest('[data-a]'); if(b) cfgAct(b.dataset.a,b.dataset.v)};
  $('#upd').onclick=actualizar; $('#bk').onclick=exportar; $('#rf').onchange=importar;
}
var VERSION='v16';
function actualizar(){
  status('Actualizando…','ok');
  var p=[];
  if(navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  if(window.caches) p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  Promise.all(p).then(function(){location.replace(location.pathname+'?u='+Date.now())});
}
function exportar(){
  var data=JSON.stringify({app:'padel-diario',version:2,partidos:rows.map(function(r){var o=Object.assign({},r);delete o.row;return o}),palas:misPalas.map(function(p){return {nombre:p.nombre,forma:p.forma,activa:p.activa!==false}})},null,1);
  var stamp=new Date().toISOString().slice(0,10);
  var file=new File([data],'padel-diario-'+stamp+'.json',{type:'application/json'});
  function done(){LS.set('padel_backup',{n:rows.length,t:new Date().toLocaleString('es-ES')});status('','');load();}
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Copia Diario de Pádel'}).then(done).catch(function(){});
  } else {
    var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();done();
  }
}
function importar(ev){
  var fl=ev.target.files[0]; if(!fl)return;
  fl.text().then(function(t){
    var j=JSON.parse(t); var list=j.partidos||[];
    var sig=function(r){return [r.fecha,r.pala,r.tipo,r.duracion,r.control,r.potencia,r.comodidad,r.fisico,r.creado].join('|')};
    var have={}; rows.forEach(function(r){have[sig(r)]=1});
    var add=list.filter(function(r){return !have[sig(r)]});
    var hp={}; misPalas.forEach(function(p){hp[p.nombre.toLowerCase()]=1});
    var addP=(j.palas||[]).filter(function(p){return p&&p.nombre&&!hp[p.nombre.toLowerCase()]});
    return add.reduce(function(p,r){var o=Object.assign({},r);delete o.id;delete o.row;return p.then(function(){return dbPut(o)})},Promise.resolve())
      .then(function(){return addP.reduce(function(p,x){return p.then(function(){return dbPut({nombre:x.nombre,forma:x.forma||'',activa:x.activa!==false},'palas')})},Promise.resolve())})
      .then(function(){status('✅ Restaurados '+add.length+' partidos y '+addP.length+' palas','ok');return load()});
  }).catch(function(e){status('Archivo no válido: '+esc(e.message),'err')});
}

function render(){
  $('#sub').textContent='Tus datos se guardan en este móvil';
  renderNew(); renderHist(); renderRep(); renderCfg();
}
init();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){}); var rl=false; navigator.serviceWorker.addEventListener('controllerchange',function(){ if(rl||!navigator.serviceWorker.controller)return; rl=true; });}
</script>
</body>
